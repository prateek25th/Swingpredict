name: Daily NSE swing-trade scan

# NSE closes at 15:30 IST. Run at 16:00 IST = 10:30 UTC, Mon-Fri.
# (GitHub cron is UTC; India = UTC+5:30.)
on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:        # manual trigger from the Actions tab

permissions:
  contents: write           # to commit reports + cached data back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily scan
        env:
          TZ: Asia/Kolkata
        run: |
          python run_daily.py

      - name: Commit reports + dashboard
        run: |
          git config user.name  "nse-swing-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/ web/ data/ || true
          git diff --quiet --staged || git commit -m "daily scan: $(date -u +'%Y-%m-%d')"
          git push

      - name: Deploy dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
